{{- $secret := required "existingSecret is required (name of a Kubernetes Secret)" .Values.existingSecret -}}
{{- $repository := required "image.repository is required" .Values.image.repository -}}
{{- $tag := required "image.tag is required" .Values.image.tag -}}
{{- $model := .Values.llm.model -}}
{{- $baseURL := .Values.llm.baseUrl -}}
{{- if ne (empty $model) (empty $baseURL) -}}
{{- fail "llm.model and llm.baseUrl must be set together" -}}
{{- end -}}
{{- $secretKeys := list "APP_ACCESS_KEY" "APP_SESSION_SECRET" "DATABASE_URL" "LLM_API_KEY" -}}
{{- if .Values.classifier.apiKeyInSecret -}}
{{- $secretKeys = append $secretKeys "CLASSIFIER_API_KEY" -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "themed-chat.fullname" . }}
  labels:
    {{- include "themed-chat.selector" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "themed-chat.selector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "themed-chat.selector" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        # The secret files belong to this group, so the app user can read them.
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: chat
          image: {{ printf "%s:%s" $repository (toString $tag) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: APP_AUTH__PUBLIC_ORIGIN
              value: {{ required "publicOrigin is required" .Values.publicOrigin | quote }}
            {{- if $model }}
            - name: APP_LLM__MODEL
              value: {{ $model | quote }}
            - name: APP_LLM__BASE_URL
              value: {{ $baseURL | quote }}
            {{- end }}
            {{- with .Values.classifier.baseUrl }}
            - name: APP_GUARD__CLASSIFIER_BASE_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.trustedProxies }}
            - name: APP_AUTH__TRUSTED_PROXIES
              value: {{ toJson . | quote }}
            {{- end }}
            # Secrets are files on a read-only volume, not environment values.
            {{- range $secretKeys }}
            - name: {{ . }}_FILE
              value: /run/secrets/themed-chat/{{ . }}
            {{- end }}
            - name: PGSSLROOTCERT
              {{- if .Values.postgresCASecret }}
              value: /etc/postgres-ca/ca.crt
              {{- else }}
              value: /etc/ssl/certs/ca-certificates.crt
              {{- end }}
          startupProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: runtime-secrets
              mountPath: /run/secrets/themed-chat
              readOnly: true
          {{- if .Values.postgresCASecret }}
            - name: postgres-ca
              mountPath: /etc/postgres-ca
              readOnly: true
          {{- end }}
      volumes:
        - name: runtime-secrets
          secret:
            secretName: {{ $secret | quote }}
            defaultMode: 0440
            items:
              {{- range $secretKeys }}
              - key: {{ . }}
                path: {{ . }}
              {{- end }}
      {{- if .Values.postgresCASecret }}
        - name: postgres-ca
          secret:
            secretName: {{ .Values.postgresCASecret | quote }}
            items:
              - key: ca.crt
                path: ca.crt
      {{- end }}
