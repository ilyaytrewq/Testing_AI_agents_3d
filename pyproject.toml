[build-system]
requires = ["uv_build==0.13.3"]
build-backend = "uv_build"

[project]
name = "themed-chat"
version = "0.1.0"
description = "A small, configurable themed chat."
requires-python = ">=3.13,<3.14"
dependencies = [
    "aiosqlite>=0.21,<1",
    "alembic>=1.15,<2",
    "fastapi>=0.115,<1",
    "itsdangerous>=2.2,<3",
    "pydantic>=2.11,<3",
    "python-dotenv>=1,<2",
    "pyyaml>=6,<7",
    "sqlalchemy[asyncio]>=2.0,<3",
    "starlette>=1,<2",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "mypy>=1.15,<3",
    "pytest>=8.3,<10",
    "ruff>=0.11,<1",
    "types-pyyaml>=6,<7",
]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib", "--strict-markers"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.13"
strict = true
files = ["src"]
