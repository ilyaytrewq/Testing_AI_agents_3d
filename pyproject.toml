[build-system]
requires = ["uv_build==0.13.3"]
build-backend = "uv_build"

[project]
name = "themed-chat"
version = "0.1.0"
description = "A small, configurable themed chat."
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.15,<2",
    "asyncpg>=0.30,<1",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "itsdangerous>=2.2,<3",
    "pydantic>=2.11,<3",
    "python-dotenv>=1,<2",
    "pyyaml>=6,<7",
    "sqlalchemy[asyncio]>=2.0,<3",
    "starlette>=1,<2",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
browser = [
    "playwright>=1.52,<2",
]
dev = [
    "asyncpg-stubs>=0.32,<0.33",
    "markdown-it-py>=4,<5",
    "mypy>=1.15,<3",
    "pytest>=8.3,<10",
    "ruff>=0.11,<1",
    "types-pyyaml>=6,<7",
]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib", "--strict-markers", "-m", "not llm_eval"]
markers = ["llm_eval: attacks against the real model; needs LLM_API_KEY, run manually"]
testpaths = ["tests/unit", "tests/integration"]
pythonpath = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.13"
strict = true
files = ["src"]
