name: Checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci_fixture_password
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.13.3"
      - run: uv sync --locked
      - run: make check
        env:
          TEST_POSTGRES_URL: postgresql+asyncpg://postgres:ci_fixture_password@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/postgres
      - run: uv run --locked --group browser playwright install --with-deps chromium
      - run: make e2e
        env:
          TEST_POSTGRES_URL: postgresql+asyncpg://postgres:ci_fixture_password@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/postgres
      - run: uv build --wheel
